name: Godot 4.3 Android APK
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/godot_build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-apk:
    name: Import, test and export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3-stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /opt/godot "${HOME}/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot.zip -d /opt/godot
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          install -m 0755 /opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          cp -a /tmp/godot-templates/templates/. "${HOME}/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Configure Android export and temporary debug signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore debug.keystore -storepass androiduser -alias androiddebugkey -keypass androiduser -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "${HOME}/.config/godot"
          printf 'export/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "${ANDROID_HOME}" "${JAVA_HOME}" > "${HOME}/.config/godot/editor_settings-4.tres"

      - name: Import project resources
        run: godot --headless --editor --path . --import --quit

      - name: Run project smoke tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/smoke_test.gd
          godot --headless --path . --script res://tests/character_select_test.gd

      - name: Export debug APK
        run: |
          mkdir -p builds
          godot --headless --verbose --path . --export-debug "Android" builds/LostTreasureKingdom.apk

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          test -s builds/LostTreasureKingdom.apk
          unzip -tq builds/LostTreasureKingdom.apk
          unzip -Z1 builds/LostTreasureKingdom.apk | grep -qx 'AndroidManifest.xml'
          unzip -Z1 builds/LostTreasureKingdom.apk | grep -Eq '^lib/arm64-v8a/[^/]+\.so$'
          unzip -Z1 builds/LostTreasureKingdom.apk | grep -Eq '^lib/armeabi-v7a/[^/]+\.so$'
          echo "APK export and package validation succeeded."

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LostTreasureKingdom-Android-APK
          path: builds/LostTreasureKingdom.apk
          if-no-files-found: error
          retention-days: 14
