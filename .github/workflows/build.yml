name: Godot Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"
      - name: Install Godot 4.3 and export templates
        run: |
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable" "$HOME/godot-bin"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ln -sf /tmp/godot/Godot_v4.3-stable_linux.x86_64 "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
      - name: Prepare temporary debug keystore and Android SDK settings
        run: |
          mkdir -p "$HOME/.config/godot"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          printf 'export/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import, validate, and run tests
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 3
          godot --headless --path . --script res://tests/smoke_test.gd
          godot --headless --path . --script res://tests/character_select_test.gd
      - name: Export debug APK
        run: mkdir -p build && godot --headless --verbose --export-debug "Android" build/game.apk
      - name: Verify APK
        run: |
          test -s build/game.apk
          unzip -tq build/game.apk
          unzip -Z1 build/game.apk | grep -qx 'AndroidManifest.xml'
          unzip -Z1 build/game.apk | grep -Eq '^lib/arm64-v8a/[^/]+\.so$'
      - uses: actions/upload-artifact@v4
        with:
          name: LostTreasureKingdom-Android-debug
          path: build/game.apk
          retention-days: 14
